name: Enterprise secret scan

on:
  pull_request:
  merge_group:

permissions:
  contents: read

# Required runs must finish independently, including merge-queue runs.
# Do not add cancel-in-progress or branch/path filters here.
jobs:
  secret-scan:
    name: Enterprise secret scan
    # Explicit condition enables cross-repository ruleset workflow execution.
    if: ${{ true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the target commit and its full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/enterprise-gitleaks.XXXXXX")"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          chmod 0755 "$tool_dir/gitleaks"
          "$tool_dir/gitleaks" version
          printf 'GITLEAKS_BINARY=%s\n' "$tool_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Load scan policy from the approved base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import tomllib

          base = os.environ['BASE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', base):
              raise SystemExit('Missing or invalid approved base commit.')
          subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], check=True)
          policy_dir = Path(tempfile.mkdtemp(prefix='enterprise-scan-policy-', dir=os.environ['RUNNER_TEMP']))

          def approved_file(name, fallback):
              entry = subprocess.check_output(['git', 'ls-tree', '-z', base, '--', name])
              if not entry:
                  content = fallback
              else:
                  mode, kind, _ = entry.split(b'\t', 1)[0].split()
                  if mode not in (b'100644', b'100755') or kind != b'blob':
                      raise SystemExit('Approved scan policy must contain regular files.')
                  content = subprocess.check_output(['git', 'show', base + ':' + name])
              destination = policy_dir / name
              destination.write_bytes(content)
              return destination

          config = approved_file('.gitleaks.toml', b'[extend]\nuseDefault = true\n')
          ignore = approved_file('.gitleaksignore', b'')
          try:
              settings = tomllib.loads(config.read_text())
          except (ValueError, UnicodeError):
              raise SystemExit('Approved Gitleaks configuration is invalid.') from None
          # Relative extensions could otherwise load a policy supplied by the PR.
          if 'path' in settings.get('extend', {}):
              raise SystemExit('File-based Gitleaks extensions are unsupported; use built-in defaults or inline rules.')
          # Gitleaks also auto-loads the source directory's .gitleaksignore,
          # even with --gitleaks-ignore-path. Scan a clone with no working files.
          source = policy_dir / 'history'
          head = subprocess.check_output(['git', 'rev-parse', '--verify', 'HEAD'], text=True).strip()
          subprocess.run(['git', 'clone', '--quiet', '--shared', '--no-checkout',
                          '--', os.environ['GITHUB_WORKSPACE'], str(source)], check=True)
          subprocess.run(['git', '-C', str(source), 'update-ref', '--no-deref', 'HEAD', head], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'GITLEAKS_CONFIG={config}\nGITLEAKS_IGNORE={ignore}\nGITLEAKS_SOURCE={source}\n')
          PY

      - name: Scan the full reachable history
        run: |
          set -euo pipefail
          # Explicit trusted files prevent PR-controlled config and ignore files.
          # Inline suppression comments must not bypass this required scan.
          env -u GITLEAKS_CONFIG_TOML "$GITLEAKS_BINARY" git "$GITLEAKS_SOURCE" \
            --config "$GITLEAKS_CONFIG" \
            --gitleaks-ignore-path "$GITLEAKS_IGNORE" \
            --ignore-gitleaks-allow \
            --log-opts='--full-history -m HEAD' \
            --redact=100 --verbose --no-banner --no-color \
            --exit-code 1 --timeout 480
