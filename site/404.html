<!doctype html>
<html lang="pl" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f4f7">
    <meta name="robots" content="noindex">
    <title>Nie znaleziono strony | OmniThings</title>
    <link rel="icon" type="image/png" href="/assets/omnithings-avatar.png">
    <script src="/site.js"></script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>
    <header class="site-header shell">
      <a class="brand" href="/" aria-label="OmniThings, strona główna">
        <img src="/assets/omnithings-avatar.png" width="32" height="32" alt="">
        <span>OmniThings</span>
      </a>
      <nav class="site-nav" aria-label="Nawigacja główna">
        <a href="/">Strona główna</a>
      </nav>
      <div class="theme-control" hidden>
        <label for="theme">Motyw</label>
        <select id="theme" name="theme" data-theme-select>
          <option value="system">Systemowy</option>
          <option value="light">Jasny</option>
          <option value="dark">Ciemny</option>
        </select>
      </div>
    </header>
    <main class="not-found shell" id="main" tabindex="-1">
      <p class="eyebrow">Błąd 404</p>
      <h1>Tu nie ma tej strony.</h1>
      <p>Sprawdź adres lub wróć na stronę główną, aby poznać OmniThings.</p>
      <a class="button" href="/">Wróć na stronę główną <span aria-hidden="true">↗</span></a>
    </main>
    <footer class="site-footer shell">
      <span class="footer-brand">OmniThings</span>
      <p>Inicjatywa <a href="https://2k-ai.com">2K-AI</a></p>
      <span class="footer-domain">omnithings.ai</span>
    </footer>
  </body>
</html>
